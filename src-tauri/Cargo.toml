[package]
name = "app"
version = "0.1.4"
description = "Stroke — fast, minimal desktop database client"
authors = ["Nischal Dahal"]
license-file = "../LICENSE"
repository = "https://github.com/stroke-app/stroke"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "process"] }
axum = { version = "0.7", features = ["json", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "mysql", "json", "chrono", "uuid", "rust_decimal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
futures = "0.3"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
libc = "0.2"
# Global allocator. glibc malloc keeps one ~64MB arena per worker thread and
# does not hand them back, so serialising one large result set left ~200MB of
# resident arenas behind for the rest of the session. mimalloc releases pages to
# the OS and is faster on the alloc-heavy JSON path.
mimalloc = { version = "0.1", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
urlencoding = "2"
ed25519-dalek = "2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"
# Secure credential storage in the OS keychain (macOS Keychain, Windows
# Credential Manager, Linux Secret Service via D-Bus). A backend feature MUST be
# enabled per platform — without one, keyring v3 silently uses an in-memory mock
# that never persists (writes return Ok but read back empty). The sync
# secret-service backend is used on Linux (blocking, so it can't dead-nest inside
# the async Tauri command runtime); crypto-rust encrypts the D-Bus session.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
duckdb = { version = "1.3.2", features = ["bundled"] }
tiberius = { version = "0.12.3", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
redis = { version = "1", features = ["tokio-comp", "tls-rustls", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSColor: builds the WKWebView `underPageBackgroundColor` that stands in for the
# page before it paints (see set_macos_webview_backdrop in lib.rs).
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSColor", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }

# Same job as the macOS block above, for the other two engines: paint the
# webview's pre-paint backdrop so startup never flashes white.
# (set_windows_webview_backdrop / set_linux_webview_backdrop in lib.rs.)
# Both are already in the tree via tauri/wry - pinned here to the versions wry
# resolves so this never links a second copy of either binding.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
gdk = "0.18"

[dev-dependencies]
# `start_paused` in #[tokio::test] - lets the connect-deadline test fire the
# timeout on a virtual clock instead of waiting CONNECT_DEADLINE for real.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
# Every command returns Result; a panic is a bug, not a recoverable IPC error,
# so drop the unwinding machinery for a smaller, faster binary.
panic = "abort"

# ── Dev-profile crypto optimization ───────────────────────────────────────────
# Connect-time auth runs heavy crypto: Postgres SCRAM-SHA-256 (PBKDF2, 4096
# HMAC-SHA-256 rounds via sha2/hmac), MySQL caching_sha2_password (RSA via
# rsa/num-bigint-dig), and rustls/ring TLS handshakes. Unoptimized, these are
# 50-200x slower — debug-build connects took seconds while release was instant.
# Optimizing only these leaf crates keeps incremental dev builds fast; they are
# compiled once and never change with app code.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.rustls]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3

# ── Dev-profile IPC optimization ──────────────────────────────────────────────
# Every command result is serialised to JSON and handed to the webview, and a
# browse of a large table is megabytes of it. At opt-level 0 serde_json's
# generated code is ~20x slower than release, so a dev build spent most of a
# row fetch inside serialisation rather than in the database. These crates are
# dependencies, so raising them costs nothing on incremental rebuilds of our
# own code.
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.serde]
opt-level = 3
[profile.dev.package.itoa]
opt-level = 3
[profile.dev.package.ryu]
opt-level = 3
[profile.dev.package.mimalloc]
opt-level = 3
[profile.dev.package.libmimalloc-sys]
opt-level = 3
# Row decoding: sqlx reads every column of every row through these.
[profile.dev.package.sqlx-core]
opt-level = 3
[profile.dev.package.sqlx-postgres]
opt-level = 3
[profile.dev.package.sqlx-mysql]
opt-level = 3
[profile.dev.package.sqlx-sqlite]
opt-level = 3
[profile.dev.package.rust_decimal]
opt-level = 3
[profile.dev.package.chrono]
opt-level = 3
[profile.dev.package.uuid]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3

# sqlx 0.8.6 drivers with one change each: the pool's on-release ping is skipped
# for a connection with nothing pending (see the "Stroke patch" comments). That
# ping cost a round trip after every query to a far host and broke Nile.
[patch.crates-io]
sqlx-postgres = { path = "vendor/sqlx-postgres" }
sqlx-mysql = { path = "vendor/sqlx-mysql" }
