# Vendored from deck (github.com/broisnees/deck, crates/agent-core).
[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
smol_str = { version = "0.3", features = ["serde"] }
