# Vendored from deck (github.com/broisnees/deck, crates/agent-claude).
[package]
name = "agent-claude"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
agent-core = { path = "../agent-core" }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
parking_lot = "0.12"
base64 = "0.22"
