# Vendored from deck (github.com/broisnees/deck, crates/agent-cli).
[package]
name = "agent-cli"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
agent-core = { path = "../agent-core" }
agent-claude = { path = "../agent-claude" }
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
# `net`: the local `opencode serve` is driven over HTTP.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
tracing = "0.1"
