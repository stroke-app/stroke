# Republish stroke-bin to the AUR for a release that is already out, after a
# fix to packaging/aur/stroke-bin/PKGBUILD.in. Bump `pkgrel` (2, 3, ...) so
# yay and paru see a new package. release.yml publishes pkgrel 1 itself.
#
# Run it from Actions → Republish to the AUR → Run workflow.

name: Republish to the AUR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag, e.g. v3.0.0
        required: true
      pkgrel:
        description: Package release (2 or higher)
        required: true
        default: '2'

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fill in the PKGBUILD
        env:
          TAG: ${{ inputs.tag }}
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          [[ "$PKGREL" =~ ^[0-9]+$ ]] || { echo "::error::pkgrel must be a number"; exit 1; }
          VERSION="${TAG#v}"
          curl -fsSL -o stroke.deb "https://github.com/stroke-app/stroke/releases/download/${TAG}/stroke_${VERSION}_amd64.deb"
          SHA=$(sha256sum stroke.deb | cut -d' ' -f1)
          mkdir -p aur
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@PKGREL@/${PKGREL}/" -e "s/@SHA256@/${SHA}/" packaging/aur/stroke-bin/PKGBUILD.in > aur/PKGBUILD
          cat aur/PKGBUILD

      - name: Push to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: stroke-bin
          pkgbuild: aur/PKGBUILD
          commit_username: broisnees
          commit_email: broisnees@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Fix the package for ${{ inputs.tag }} (pkgrel ${{ inputs.pkgrel }})"
          ssh_keyscan_types: rsa,ecdsa,ed25519
