# Versions and stable releases, driven by merged PRs.
#
#   PR merged into `nightly`   → bump the version on nightly (one patch per PR)
#                                and fold .changeset/*.md into CHANGELOG.md.
#                                No tag: nightly.yml builds it as Stroke Nightly.
#       label release:minor    → x.Y.0 instead
#       label release:major    → X.0.0 instead
#       label release:skip     → no bump (docs, CI, chores)
#
#   PR `nightly` → `master`    → the promotion (promote.yml opens it). Tags
#                                vX.Y.Z at the version nightly already has, which
#                                triggers release.yml to build and publish Stable.
#
#   Any other PR into `master` → a hotfix. With a release:* label it bumps,
#                                tags and releases like before; master is then
#                                merged back into nightly.
#
# Patch versions run .1-.9; the patch after .9 is the next minor
# (scripts/release-bump.cjs).

name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [nightly, master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One version change at a time per branch: two merges in a row must not
  # both read the same version.
  group: auto-release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  # ── PR merged into nightly: one version per PR ─────────────────────────────
  nightly-version:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'nightly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The full ref: a `nightly` tag (the rolling pre-release) exists too.
          ref: refs/heads/nightly
          fetch-depth: 0
          # A PAT, so the bump commit can be pushed to nightly.
          token: ${{ secrets.RELEASES_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve bump type
        id: bump
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "PR labels: $LABELS"
          if   echo "$LABELS" | grep -q '"release:skip"';  then echo "type=skip"  >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"release:major"'; then echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"release:minor"'; then echo "type=minor" >> "$GITHUB_OUTPUT"
          else                                                  echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and update changelog
        if: steps.bump.outputs.type != 'skip'
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release-bump.cjs

      - name: Commit to nightly
        if: steps.bump.outputs.type != 'skip'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json CHANGELOG.md .changeset/
          git commit -m "chore: version ${VERSION} (#${PR_NUMBER})"
          git push origin HEAD:refs/heads/nightly
          echo "nightly is now ${VERSION}; the next nightly build ships it."

  # ── PR merged into master: promotion or hotfix ─────────────────────────────
  stable-release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          # Tags pushed with the default GITHUB_TOKEN never trigger other
          # workflows, so release.yml would not start. Use the PAT.
          token: ${{ secrets.RELEASES_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Decide what this merge is
        id: kind
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if [ "$HEAD_REF" = "nightly" ]; then
            echo "kind=promotion" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"release:major"'; then echo "kind=hotfix" >> "$GITHUB_OUTPUT"; echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"release:minor"'; then echo "kind=hotfix" >> "$GITHUB_OUTPUT"; echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"release:patch"'; then echo "kind=hotfix" >> "$GITHUB_OUTPUT"; echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "Not a promotion and no release:* label — nothing to release."
          fi

      # A hotfix ships its own version; a promotion ships the version nightly
      # already carries.
      - name: Bump version (hotfix)
        if: steps.kind.outputs.kind == 'hotfix'
        env:
          BUMP_TYPE: ${{ steps.kind.outputs.type }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/release-bump.cjs
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json CHANGELOG.md .changeset/
          git commit -m "chore: release ${VERSION}"
          git push origin HEAD:master

      - name: Tag the release
        if: steps.kind.outputs.kind != 'none'
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists. Nightly has nothing newer than the last stable release."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "✅ ${TAG} pushed — release.yml will now build and publish Stable."

      # Keep nightly ahead of master: a hotfix (and a squash-merged promotion)
      # only lands on master otherwise. A conflict opens a PR instead.
      - name: Merge master back into nightly
        if: steps.kind.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/heads/nightly:refs/remotes/origin/nightly
          git checkout -B nightly refs/remotes/origin/nightly
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "nightly already contains master."
          elif git merge --no-edit origin/master -m "chore: merge master into nightly"; then
            git push origin HEAD:refs/heads/nightly
          else
            git merge --abort
            gh pr create --base nightly --head master \
              --title "chore: merge master into nightly" \
              --body "master has changes nightly lacks and they conflict; resolve here." \
              --label "release:skip" || true
          fi
